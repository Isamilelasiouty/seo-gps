name: Hourly Crawl Dispatcher

on:
  schedule:
    - cron: '0 * * * *' # Every hour on the hour
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Optional specific Project ID to run immediately'
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select-projects.outputs.matrix }}
      has_projects: ${{ steps.select-projects.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install httpx python-dotenv

      - name: Select Due Projects
        id: select-projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: |
          python - << 'EOF'
          import os, json, httpx
          from datetime import datetime, timezone
          
          url = os.environ.get("SUPABASE_URL")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          single_id = os.environ.get("INPUT_PROJECT_ID")
          
          projects = []
          if url and key:
              headers = {"apikey": key, "Authorization": f"Bearer {key}"}
              if single_id:
                  resp = httpx.get(f"{url}/rest/v1/projects?id=eq.{single_id}&select=*,project_settings(*)", headers=headers)
              else:
                  # Hourly selection query
                  resp = httpx.get(f"{url}/rest/v1/projects?status=eq.active&select=*,project_settings(*)", headers=headers)
              if resp.status_code == 200:
                  raw_projects = resp.json()
                  current_utc = datetime.now(timezone.utc)
                  current_hour = current_utc.hour

                  for p in raw_projects:
                      domain = p.get("domain", "")

                      # Enforce strictly ONCE PER DAY:
                      if not single_id:
                          # 1. If project ran in the last 20 hours, SKIP
                          last_run = p.get("last_run_at")
                          if last_run:
                              try:
                                  last_dt = datetime.fromisoformat(last_run.replace("Z", "+00:00"))
                                  hours_ago = (current_utc - last_dt).total_seconds() / 3600.0
                                  if hours_ago < 20.0:
                                      print(f"[Dispatcher] Skip {domain}: Already ran {hours_ago:.1f} hours ago (once-per-day rule)")
                                      continue
                              except Exception as e:
                                  print(f"[Dispatcher] Error parsing last_run_at for {domain}: {e}")

                          # 2. Daily crawl hour matching (default: 3 AM UTC if not set)
                          target_hour = p.get("daily_crawl_hour")
                          if target_hour is None:
                              target_hour = 3

                          is_scheduled_hour = (current_hour == int(target_hour))
                          is_first_run = (last_run is None)

                          if not (is_scheduled_hour or is_first_run):
                              print(f"[Dispatcher] Skip {domain}: Current hour {current_hour} != scheduled hour {target_hour}")
                              continue

                      settings = p.get("project_settings")
                      recipients = []
                      if isinstance(settings, list) and len(settings) > 0:
                          recipients = settings[0].get("recipient_emails", [])
                      elif isinstance(settings, dict):
                          recipients = settings.get("recipient_emails", [])
                      if p.get("recipient_email") and p["recipient_email"] not in recipients:
                          recipients.append(p["recipient_email"])
                      p["recipients"] = recipients
                      projects.append(p)
          
          # Output for matrix
          has_projects = "true" if projects else "false"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"has_projects={has_projects}\n")
              f.write(f"matrix={json.dumps(projects[:10])}\n")
          EOF

  crawl:
    needs: dispatch
    if: needs.dispatch.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.dispatch.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: |
          pip install -r engine/requirements.txt

      - name: Run Crawl & Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRONTEND_URL: "https://isamilelasiouty.github.io/seo-gps"
          PROJECT_DATA: ${{ toJson(matrix.project) }}
        run: |
          python -m engine.main
