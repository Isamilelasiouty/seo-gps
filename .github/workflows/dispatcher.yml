name: Hourly Crawl Dispatcher

on:
  schedule:
    - cron: '0 * * * *' # Every hour on the hour
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Optional specific Project ID to run immediately'
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select-projects.outputs.matrix }}
      has_projects: ${{ steps.select-projects.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install httpx python-dotenv

      - name: Select Due Projects
        id: select-projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: |
          python - << 'EOF'
          import os, json, httpx
          from datetime import datetime
          
          url = os.environ.get("SUPABASE_URL")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          single_id = os.environ.get("INPUT_PROJECT_ID")
          
          projects = []
          if url and key:
              headers = {"apikey": key, "Authorization": f"Bearer {key}"}
              if single_id:
                  resp = httpx.get(f"{url}/rest/v1/projects?id=eq.{single_id}&select=*", headers=headers)
              else:
                  # Hourly selection query
                  resp = httpx.get(f"{url}/rest/v1/projects?status=eq.active&select=*", headers=headers)
              if resp.status_code == 200:
                  projects = resp.json()
          
          # Output for matrix
          has_projects = "true" if projects else "false"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"has_projects={has_projects}\n")
              f.write(f"matrix={json.dumps(projects[:10])}\n")
          EOF

  crawl:
    needs: dispatch
    if: needs.dispatch.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.dispatch.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: |
          pip install -r engine/requirements.txt

      - name: Run Crawl & Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python -m engine.main
